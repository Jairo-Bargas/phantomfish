<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>{% block title %}{{ APP_NAME }}{% endblock %} · {{ APP_NAME }}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
{% if partner %}
  <header class="topbar">
    <a href="/" class="brand">🎣 {{ APP_NAME }}</a>
    <div class="topbar-right">
      <a href="/socios" class="chip" title="Socios y auditoría">{{ partner.name }}</a>
      <a href="/logout" class="chip chip-ghost">Salir</a>
    </div>
  </header>
{% endif %}

  <main class="content{% if not partner %} content-plain{% endif %}">
    {% if flashes %}
      <div class="flashes">
        {% for f in flashes %}
          <div class="flash flash-{{ f.category }}">{{ f.message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

{% if partner %}
  <nav class="tabbar">
    <a href="/" class="tab {% if active_nav == 'dashboard' %}is-active{% endif %}">
      <span class="tab-ico">◧</span><span>Tablero</span></a>
    <a href="/pagos" class="tab {% if active_nav == 'pagos' %}is-active{% endif %}">
      <span class="tab-ico">↓</span><span>Pagos</span></a>
    <a href="/pedidos" class="tab {% if active_nav == 'pedidos' %}is-active{% endif %}">
      <span class="tab-ico">📦</span><span>Pedidos</span></a>
    <a href="/ventas" class="tab {% if active_nav == 'ventas' %}is-active{% endif %}">
      <span class="tab-ico">↑</span><span>Ventas</span></a>
    <a href="/reporte" class="tab {% if active_nav == 'reporte' %}is-active{% endif %}">
      <span class="tab-ico">▤</span><span>Reporte</span></a>
    <a href="/socios" class="tab {% if active_nav == 'socios' %}is-active{% endif %}">
      <span class="tab-ico">⇄</span><span>Socios</span></a>
  </nav>
{% endif %}

  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
