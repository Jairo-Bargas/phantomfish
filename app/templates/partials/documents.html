<div class="card">
  <div class="section-head"><h2>Comprobantes</h2></div>
  {% if documents %}
  <div class="stack">
    {% for d in documents %}
    <div class="doc">
      <span>{{ '📄' if d.content_type == 'application/pdf' else '🖼️' }}</span>
      <a href="/comprobantes/{{ d.id }}/ver" target="_blank" rel="noopener">{{ d.original_filename }}</a>
      <form method="post" action="/comprobantes/{{ d.id }}/eliminar" data-confirm="¿Eliminar este comprobante?">
        <button class="btn btn-danger btn-sm" type="submit">✕</button>
      </form>
    </div>
    {% endfor %}
  </div>
  {% else %}
    <p class="muted small">Sin comprobantes todavía.</p>
  {% endif %}
  <form method="post" action="/comprobantes/{{ doc_entity }}/{{ doc_owner_id }}"
        enctype="multipart/form-data" class="stack" style="margin-top:12px">
    <input name="comprobantes" type="file" multiple accept=".pdf,image/*,application/pdf" required>
    <button class="btn btn-ghost btn-sm btn-block" type="submit">Subir comprobante</button>
  </form>
</div>
