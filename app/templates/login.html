{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="login-card">
  <div class="card">
    <div class="login-logo">🎣</div>
    <h1 style="text-align:center">{{ APP_NAME }}</h1>
    <p class="muted small" style="text-align:center">Gestión administrativa</p>
    <form method="post" action="/login" class="stack" style="margin-top:14px">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none"
               value="{{ username or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
